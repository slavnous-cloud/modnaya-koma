<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telegram-канал «Модная кома»</title>
    <meta name="description" content="Переход в Telegram-канал «Модная кома»">

    <meta http-equiv="refresh" content="2;url=https://t.me/modnayacoma">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4f7fa;
            color: #1f2937;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 40px 24px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .icon {
            margin-bottom: 18px;
            font-size: 54px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            color: #64748b;
            font-size: 17px;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 15px 24px;
            border-radius: 12px;
            background: #229ed9;
            color: white;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            background: #168ac1;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="icon">✈️</div>

        <h1>«Модная кома»</h1>

        <p>
            Переходим в Telegram-канал.<br>
            Если Telegram не открылся автоматически, нажмите кнопку.
        </p>

        <a href="https://t.me/modnayacoma">
            Открыть Telegram
        </a>
    </main>
</body>
</html>
